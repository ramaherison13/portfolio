<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#avatarGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Head & Body Silhouette -->
  <circle cx="200" cy="150" r="65" fill="url(#avatarGrad)"/>
  <path d="M 90,330 C 90,230 310,230 310,330 Z" fill="url(#avatarGrad)"/>
  <!-- Code Icon Overlay -->
  <rect x="130" y="270" width="140" height="50" rx="10" fill="#070b12" opacity="0.85" stroke="#00e5ff" stroke-width="2"/>
  <text x="200" y="302" font-family="monospace" font-size="20" font-weight="bold" fill="#00e5ff" text-anchor="middle">&lt;Lucien /&gt;</text>
</svg>
